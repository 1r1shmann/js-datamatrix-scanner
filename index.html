<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>DataMatrix Scanner</title>

<style>

    *{
        box-sizing:border-box;
        margin:0;
        padding:0;
    }

    body{
        background:#111;
        color:#fff;
        font-family:Arial,sans-serif;
        min-height:100vh;
        display:flex;
        flex-direction:column;
        align-items:center;
        padding:16px;
    }

    h2{
        margin:16px 0;
        font-size:24px;
    }

    #reader{
        width:100%;
        max-width:500px;
        aspect-ratio:1/1;
        overflow:hidden;
        border-radius:16px;
        background:#000;
    }

    #result{
        width:100%;
        max-width:500px;
        margin-top:16px;
        font-size:16px;
        background:#222;
        padding:14px;
        border-radius:12px;
        word-break:break-word;
        text-align:left;
    }

    .buttons{
        width:100%;
        max-width:500px;
        display:flex;
        gap:12px;
        margin-top:16px;
    }

    button{
        flex:1;
        padding:16px;
        border:none;
        border-radius:12px;
        font-size:18px;
        background:#2d7cff;
        color:white;
        font-weight:bold;
        cursor:pointer;
        touch-action:manipulation;
    }

    button:active{
        transform:scale(0.98);
    }

    .stop{
        background:#444;
    }

</style>
</head>

<body>

<h2>Сканер DataMatrix</h2>

<div id="reader"></div>

<div class="buttons">
    <button onclick="start()">Старт</button>
    <button class="stop" onclick="stop()">Стоп</button>
</div>

<div id="result">Результат: -</div>

<script src="html5-qrcode.min.js"></script>

<script>

    let scanner = null
    let started = false

    async function start() {

        if (started) return

        scanner = new Html5Qrcode("reader")

        try {

            await scanner.start(
                {
                    facingMode: {
                        exact: "environment"
                    }
                },
                {
                    fps: 15,
                    qrbox: (w, h) => {

                        let size = Math.min(w, h) * 0.8

                        return {
                            width: size,
                            height: size
                        }
                    },

                    aspectRatio: 1,
                    disableFlip: false,
                    formatsToSupport: [
                        Html5QrcodeSupportedFormats.DATA_MATRIX
                    ]
                },

                onScanSuccess,
                onScanError
            )

            started = true

        } catch (e) {

            document.getElementById("result").innerText =
                "Ошибка камеры: " + e

        }

    }

    async function stop() {

        if (!scanner || !started) return

        await scanner.stop()
        await scanner.clear()

        started = false

    }

    function onScanSuccess(code) {

        document.getElementById("result").innerText =
            "Результат: " + code

        // вибрация
        if (navigator.vibrate) {
            navigator.vibrate(100)
        }

        // автопауза после успешного скана
        stop()

    }

    function onScanError(error) {
        // можно оставить пустым
    }

</script>

</body>
</html>
